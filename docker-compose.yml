services:
  homedash:
    image: ${HOMEDASH_IMAGE:-ghcr.io/immer-gut/homedash:v1.8.2}
    restart: unless-stopped
    ports:
      - "${HOMEDASH_PORT:-3002}:${HOMEDASH_INTERNAL_PORT:-3000}"
    environment:
      PORT: ${HOMEDASH_INTERNAL_PORT:-3000}
      HOST: 0.0.0.0
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HOMEDASH_STATUS_TARGETS: ${HOMEDASH_STATUS_TARGETS:-[]}
    volumes:
      - homedash_data:/data

volumes:
  homedash_data:
    name: ${HOMEDASH_VOLUME_NAME:-homedash_data}
